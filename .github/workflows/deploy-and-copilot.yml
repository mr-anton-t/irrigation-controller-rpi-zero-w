name: Deploy test and Copilot review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: deploy-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-test:
    name: Docker deploy smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: TypeScript build
        run: |
          npm install
          npx tsc --noEmit

      - name: Build and start compose stack
        run: docker compose up --build -d --wait --wait-timeout 120 || docker compose up --build -d

      - name: Wait until the app answers
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/status >/tmp/status.json 2>/dev/null; then
              echo "up after ${i} attempts"
              cat /tmp/status.json
              exit 0
            fi
            echo "waiting (${i}/40)"
            sleep 3
          done
          echo "container logs:"
          docker compose logs --no-color || true
          exit 1

      - name: Smoke-test HTTP and API
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "GET / %{http_code}\n" http://127.0.0.1:3000/
          curl -fsS -o /dev/null -w "GET /settings.html %{http_code}\n" http://127.0.0.1:3000/settings.html
          curl -fsS -o /dev/null -w "GET /chart.html %{http_code}\n" http://127.0.0.1:3000/chart.html
          STATUS=$(curl -fsS http://127.0.0.1:3000/api/status)
          echo "$STATUS"
          echo "$STATUS" | grep -q '"mock":true'
          curl -fsS http://127.0.0.1:3000/api/settings >/dev/null
          curl -fsS http://127.0.0.1:3000/api/network >/dev/null
          curl -fsS http://127.0.0.1:3000/api/readings >/dev/null
          curl -fsS -X POST http://127.0.0.1:3000/api/relay \
            -H 'content-type: application/json' \
            -d '{"on":true,"durationSec":1}' >/dev/null
          echo "deploy smoke test passed"

      - name: Stop stack
        if: always()
        run: docker compose down -v

  request-copilot:
    name: Assign Copilot review after green tests
    needs: deploy-test
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request or re-request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          REVIEWER="copilot-pull-request-reviewer[bot]"

          echo "PR #${PR} action=${ACTION}: requesting Copilot review after green deploy test"

          # If Copilot already reviewed an earlier commit, drop the stale request
          # so the next POST is treated as a fresh / re-request.
          gh api --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f "reviewers[]=${REVIEWER}" || true

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f "reviewers[]=${REVIEWER}"

          # GraphQL fallback: re-request by bot node id (needed after Copilot already left a review).
          PR_NODE=$(gh api graphql -f query="query(\$o:String!,\$n:String!,\$p:Int!){repository(owner:\$o,name:\$n){pullRequest(number:\$p){id}}}" -F o="${REPO%%/*}" -F n="${REPO##*/}" -F p="${PR}" --jq '.data.repository.pullRequest.id')
          BOT_NODE=$(gh api "/users/copilot-pull-request-reviewer%5Bbot%5D" --jq '.node_id' || true)
          if [ -n "${PR_NODE}" ] && [ -n "${BOT_NODE}" ]; then
            gh api graphql -f query='mutation($pr:ID!,$bot:ID!){requestReviews(input:{pullRequestId:$pr,botIds:[$bot],union:true}){clientMutationId}}' -F pr="${PR_NODE}" -F bot="${BOT_NODE}" || true
          fi

          if [ "${ACTION}" = "synchronize" ]; then
            BODY="Deploy-тест снова зелёный на этом PR. Повторно запросил review у Copilot."
          else
            BODY="Deploy-тест прошёл. Назначил Copilot (copilot-pull-request-reviewer) ревьюером."
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/issues/${PR}/comments" \
            -f "body=${BODY}" || true
