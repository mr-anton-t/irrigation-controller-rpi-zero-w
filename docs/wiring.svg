  <rect x="686" y="202" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
  <text x="722" y="130" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="12">VIN</text>
  <text x="722" y="158" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="12">GND</text>
  <text x="722" y="186" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="12">SDA</text>
  <text x="722" y="214" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="12">SCL</text>

  <rect x="700" y="300" width="220" height="200" rx="8" fill="#1f2937" stroke="#111" stroke-width="3"/>
  <rect x="720" y="318" width="80" height="52" rx="6" fill="#2563eb"/>
  <text x="732" y="340" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">SRD-05</text>
  <text x="736" y="358" fill="#dbeafe" font-family="Arial,sans-serif" font-size="11">реле 5V</text>
  <circle cx="880" cy="344" r="10" fill="#22c55e"/>
  <rect x="686" y="390" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
  <rect x="686" y="418" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
  <rect x="686" y="446" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
  <text x="722" y="402" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="13">VCC</text>
  <text x="722" y="430" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="13">GND</text>
  <text x="722" y="458" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="13">IN</text>
  <rect x="820" y="390" width="84" height="86" rx="4" fill="#334155"/>
  <text x="832" y="418" fill="#fde68a" font-family="Arial,sans-serif" font-size="11">COM</text>
  <text x="832" y="438" fill="#fde68a" font-family="Arial,sans-serif" font-size="11">NO</text>
  <text x="832" y="458" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">пусто</text>

  <rect x="1040" y="90" width="320" height="150" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <rect x="1060" y="118" width="70" height="90" rx="6" fill="#64748b"/>
  <rect x="1140" y="118" width="70" height="90" rx="6" fill="#475569"/>
  <rect x="1124" y="138" width="22" height="50" fill="#334155"/>
  <text x="1220" y="140" fill="#111" font-family="Arial,sans-serif" font-size="15" font-weight="700">Трансформатор</text>
  <text x="1220" y="162" fill="#334155" font-family="Arial,sans-serif" font-size="12">220 В → 24–25 В ~</text>
  <text x="1220" y="184" fill="#6d28d9" font-family="Arial,sans-serif" font-size="12" font-weight="700">выход ~</text>

  <rect x="1040" y="280" width="320" height="170" rx="10" fill="#fb923c" stroke="#9a3412" stroke-width="3"/>
  <rect x="1060" y="300" width="100" height="70" rx="6" fill="#111"/>
  <text x="1072" y="328" fill="#fdba74" font-family="Arial,sans-serif" font-size="12">LM2596HV</text>
  <text x="1078" y="346" fill="#fff" font-family="Arial,sans-serif" font-size="11">+ мост AC</text>
  <circle cx="1320" cy="318" r="8" fill="#22c55e"/>
  <text x="1060" y="400" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="13">AC IN</text>
  <text x="1180" y="400" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="13">OUT+ 5V</text>
  <text x="1180" y="424" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="13">OUT- GND</text>
  <rect x="1026" y="390" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
  <rect x="1344" y="390" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
  <rect x="1344" y="414" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>

  <rect x="1040" y="480" width="320" height="160" rx="10" fill="#16a34a" stroke="#14532d" stroke-width="3"/>
  <rect x="1060" y="504" width="36" height="70" rx="4" fill="#86efac" stroke="#14532d"/>
  <rect x="1070" y="498" width="16" height="8" fill="#14532d"/>
  <text x="1110" y="524" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Аккумулятор 1S</text>
  <text x="1110" y="546" fill="#dcfce7" font-family="Arial,sans-serif" font-size="12">18650 / LiPo 3.7 В</text>
  <text x="1110" y="568" fill="#dcfce7" font-family="Arial,sans-serif" font-size="12">TP4056 → boost 5 В</text>
  <text x="1110" y="598" fill="#fff" font-family="Arial,sans-serif" font-size="12">второй вариант питания</text>
  <text x="1110" y="618" fill="#dcfce7" font-family="Arial,sans-serif" font-size="12">не вместе с AC-DC</text>

  <path d="M326 257 H380 V125 H694" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 409 H400 V153 H694" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 333 H430 V181 H694" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 371 H460 V209 H694" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 295 H480 V397 H694" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 447 H500 V425 H694" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 485 H520 V453 H694" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1200 240 V270 H1034 V397" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1210" y="268" fill="#6d28d9" font-family="Arial,sans-serif" font-size="13" font-weight="700">25V~</text>
  <path d="M1360 397 H1380 V70 H360 V295 H326" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1360 421 H1392 V880 H20 V409 H326" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="40" y="680" width="960" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="710" fill="#111" font-family="Arial,sans-serif" font-size="16" font-weight="700">Подключение по проводам</text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#111">
    <text x="60" y="740">синий: pin 1 → BME280 VIN</text>
    <text x="60" y="762">зелёный: pin 3 → SDA, pin 5 → SCL</text>
    <text x="60" y="784">чёрный: pin 6 → BME280 GND, pin 9 → реле GND</text>
    <text x="60" y="806">красный: pin 2 ↔ реле VCC ↔ OUT+ модуля 5 В</text>
    <text x="480" y="740">оранжевый: pin 11 GPIO17 → реле IN</text>
    <text x="480" y="762">фиолетовый: выход трансформатора ~ → AC IN</text>
    <text x="480" y="784">COM / NO реле не подключать</text>
    <text x="480" y="806">25 В ~ не на датчик, GPIO и аккумулятор</text>
    <text x="60" y="846">Аккумулятор 1S + TP4056 + boost — вместо трансформатора и AC-DC, не оба сразу.</text>
  </g>
</svg>
