<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Схема подключения с деталями и проводами">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="28" y="38" fill="#111" font-family="Arial,sans-serif" font-size="26" font-weight="700">Полив · схема подключения</text>
  <text x="28" y="60" fill="#666" font-family="Arial,sans-serif" font-size="14">провода: красный 5V · чёрный GND · синий 3.3V · зелёный I2C · оранжевый GPIO17 · фиолетовый 25V~</text>

  <rect x="40" y="120" width="300" height="430" rx="16" fill="#2b7de9" stroke="#0f3d7a" stroke-width="4"/>
  <rect x="58" y="138" width="170" height="96" rx="8" fill="#1a4fa3"/>
  <circle cx="88" cy="176" r="22" fill="#cfe4ff"/>
  <circle cx="88" cy="176" r="10" fill="#2b7de9"/>
  <text x="118" y="172" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Pi Zero W</text>
  <text x="118" y="192" fill="#d7e6ff" font-family="Arial,sans-serif" font-size="11">Wi-Fi / 512MB</text>
  <rect x="308" y="248" width="18" height="18" rx="2" fill="#f1f5f9" stroke="#334155"/>
  <rect x="308" y="286" width="18" height="18" rx="2" fill="#f1f5f9" stroke="#334155"/>
  <rect x="308" y="324" width="18" height="18" rx="2" fill="#f1f5f9" stroke="#334155"/>
