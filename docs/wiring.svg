  <rect x="308" y="438" width="18" height="18" rx="2" fill="#f1f5f9" stroke="#334155"/>
  <rect x="308" y="476" width="18" height="18" rx="2" fill="#f1f5f9" stroke="#334155"/>
  <g fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="13">
    <text x="58" y="262">1  3V3</text>
    <text x="58" y="300">2  5V</text>
    <text x="58" y="338">3  SDA GPIO2</text>
    <text x="58" y="376">5  SCL GPIO3</text>
    <text x="58" y="414">6  GND</text>
    <text x="58" y="452">9  GND</text>
    <text x="58" y="490">11 GPIO17</text>
  </g>
  <rect x="58" y="510" width="90" height="22" rx="4" fill="#111"/>
  <text x="70" y="526" fill="#fff" font-family="Arial,sans-serif" font-size="11">USB OTG</text>

  <rect x="700" y="90" width="200" height="160" rx="8" fill="#7c3aed" stroke="#4c1d95" stroke-width="3"/>
  <rect x="722" y="108" width="70" height="48" rx="4" fill="#111"/>
  <text x="800" y="128" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">BME280</text>
  <text x="800" y="148" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="11">3.3V I2C</text>
  <rect x="686" y="118" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
  <rect x="686" y="146" width="16" height="14" fill="#e2e8f0" stroke="#334155"/>
