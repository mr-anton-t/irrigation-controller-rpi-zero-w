  <text x="50" y="832" fill="#111" font-family="Arial,sans-serif" font-size="16" font-weight="700">Питание и гребёнка</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#111">
    <text x="50" y="868">Вариант A: 24–25 В ~ → AC-DC 5 В → pin 2 / pin 6</text>
    <text x="50" y="894">Вариант B: USB → TP4056 → аккумулятор 1S → boost 5 В → pin 2 / pin 6</text>
    <text x="50" y="920">Внешний ряд гребёнки (ближе к краю): pin 2 — 5 В, pin 6 — GND — провод прямо</text>
    <text x="50" y="946">Внутренний ряд (дальше от края): pin 1 — 3.3 В, pin 3 SDA, pin 5 SCL, pin 9 GND, pin 11 GPIO17 — 30°, затем прямо</text>
    <text x="50" y="980">Провода не накладываются. Зазор между ними = 2 толщины провода. Пересечение не больше одного.</text>
    <text x="50" y="1006">25 В ~ не на TP4056, датчик и GPIO. AC-DC и TP4056 не включать параллельно на pin 2.</text>
  </g>
